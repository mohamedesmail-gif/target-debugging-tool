# TEMPLATE: not run yet. Fill the repository variables / secrets before enabling.
#   vars.AWS_REGION, vars.DATA_BUCKET (private S3 bucket holding the data pack), vars.SITE_BUCKET, vars.CLOUDFRONT_DISTRIBUTION_ID
#   secrets.AWS_ROLE_ARN (an IAM role trusted by GitHub OIDC; read on DATA_BUCKET, write on SITE_BUCKET, cloudfront:CreateInvalidation)
# The data pack (data/*) is commercial data and is NOT in git: the pipeline downloads it from S3 at build time.
name: ci-deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { id-token: write, contents: read }
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - name: Download the data pack
        run: aws s3 sync "s3://${{ vars.DATA_BUCKET }}/target-tracker-data/" data/
      - run: npm ci
      - run: npm test                 # assemble + bundle + 149 smoke checks
      - run: npm run web:build
      - uses: actions/upload-artifact@v4
        with: { name: site, path: dist-web }
  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site, path: dist-web }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - run: aws s3 sync dist-web "s3://${{ vars.SITE_BUCKET }}/" --delete --cache-control "public,max-age=2592000,immutable" --exclude index.html
      - run: aws s3 cp dist-web/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" --cache-control "no-cache"
      - run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html"
