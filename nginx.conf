server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types application/manifest+json text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  location / { try_files $uri /index.html; }
  location ~* \.(js|css|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  # PWA files: the worker and manifest must always be re-checked, or updates never reach users.
  location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; }
  location = /offline.html { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; }
}
